<!DOCTYPE html>
<html lang="en">
<head>
    <title>atq matcha images tab(temp)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- nav bar if needed, not implemented yet -->
    <header class="topbar">
        <div class="brand">atq matcha</div>
        <a class="top-link" href="#">Home</a>
        <a class="top-link active" href="#">Gallery</a>

        <div class="search-wrap">
            <div class="search-bar">Search</div>
        </div>
    </header>

    <main class="page">
        <!-- heading -->
        <section class="intro">
            <h1>Product Image Gallery</h1>
        </section>

        <!-- image boxes -->
        <section class="gallery" id="gallery"></section>
    </main>

    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn">&times;</button>

        <div class="lightbox-card">
            <img id="lightboxImg" src="" alt="Expanded gallery image">

            <div class="lightbox-info">
                <h2 id="lightboxTitle"></h2>
                <p id="lightboxDesc"></p>
            </div>
        </div>
    </div>

    <!-- this connects the js file so the gallery loads and the popup works -->
    <script src="script.js"></script>
</body>
</html>
